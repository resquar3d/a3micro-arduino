name: Compile Examples

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Arduino Lint
        uses: arduino/arduino-lint-action@v2
        with:
          compliance: specification
          library-manager: submit

  # The MicroPython library and its examples (ESP32, Raspberry Pi Pico W and HM-10 boards):
  # compiled with mpy-cross, MicroPython's own compiler, so any error in them fails the check
  micropython:
    name: MicroPython (ESP32, Pico W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mpy-cross
        run: pipx install mpy-cross
      - name: Compile the library and examples
        run: |
          mpy-cross --version
          for f in $(find micropython -name '*.py' | sort); do
            echo "Compiling $f"
            mpy-cross -o "$RUNNER_TEMP/check.mpy" "$f"
          done

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UNO R3
            fqbn: arduino:avr:uno
            platform: arduino:avr
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/HM10_BLE_READ_LED
              - examples/HM10_BLE_WRITE_BUTTON
              - examples/HM10_BLE_WRITE_REPEAT
              - examples/HM10_BLE_WRITE_ULTRASONIC_SENSOR
              - examples/HM10_SETUP
              - examples/UNO_R3_LED
              - examples/UNO_R3_RGB_LED
          - name: UNO R4 Minima
            fqbn: arduino:renesas_uno:minima
            platform: arduino:renesas_uno
            libraries: |
              - source-path: ./
            sketch-paths: |
              - examples/UNO_R4_MINIMA_LED
              - examples/UNO_R4_MINIMA_RGB_LED
          - name: UNO R4 WiFi
            fqbn: arduino:renesas_uno:unor4wifi
            platform: arduino:renesas_uno
            libraries: |
              - source-path: ./
              - name: ArduinoBLE
              - name: Servo
            sketch-paths: |
              - examples/UNO_R4_WIFI_HUD_DRIVE
              - examples/UNO_R4_WIFI_LED
              - examples/UNO_R4_WIFI_SERVO
              - examples/UNO_R4_WIFI_VOICE_COMMANDS
              - examples/UNO_R4_WIFI_WRITE_BUTTON

    name: Compile for ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: ${{ matrix.platform }}
          libraries: ${{ matrix.libraries }}
          sketch-paths: ${{ matrix.sketch-paths }}
          verbose: false

  # The ESP32 HID bridge: classic ESP32, ESP32-S3 as a USB keyboard and mouse too (USB-OTG), ESP32-C3
  esp32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32
            fqbn: esp32:esp32:esp32
          - name: ESP32-S3 (Bluetooth + USB)
            fqbn: esp32:esp32:esp32s3:USBMode=default
          - name: ESP32-S3 (Bluetooth)
            fqbn: esp32:esp32:esp32s3
          - name: ESP32-C3
            fqbn: esp32:esp32:esp32c3
    name: Compile for ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the esp32 boards
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32 --additional-urls "$URL"
      # Each compiler error also becomes an annotation, so it can be read without opening the log
      - name: Compile the HID bridge
        run: |
          set +e
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --library . examples/ESP32_HID_BRIDGE > build.log 2>&1
          status=$?
          cat build.log
          grep -E "error|Error" build.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status
