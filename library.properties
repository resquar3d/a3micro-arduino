sentence=Control your board from the A3Micro Control app over Bluetooth LE (HM-10 or the UNO R4 WiFi's own radio).
paragraph=Uses the A3Micro protocol, ##;label:value,...;##, in both directions: buttons, sliders and a joystick arrive as labelled values, and the board sends readings back the same way. Works with an HM-10 module on any board or the built-in Bluetooth LE of the UNO R4 WiFi. Needs the A3 Micro app 1.8 or newer for Android (a3micro.twinsparks.dev).
